# Production override. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Only the web entry point (nginx) is published. The API, Redis, Prometheus and the Streamlit
# dashboard stay on the private Docker network.
services:
  frontend:
    ports: !override
      - "${HTTP_PORT:-80}:80"
  api:
    ports: !reset []
    environment:
      # Trust forwarded-IP headers only from the nginx container on the Docker network.
      - TRUSTED_PROXIES=172.16.0.0/12
  redis:
    ports: !reset []
  dashboard:
    ports: !reset []
  prometheus:
    ports: !reset []
